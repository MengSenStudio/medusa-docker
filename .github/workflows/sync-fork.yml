# Keep this fork in sync with the upstream starter:
#   https://github.com/medusajs/dtc-starter
#
# Why not the GitHub "Sync fork" button? The web merge cannot run pnpm, and every
# upstream release rewrites pnpm-lock.yaml, so the fork's own dependency
# (qrcode.react, used by the Alipay QR checkout) always collides with it. GitHub
# then reports "This branch has conflicts that must be resolved" and only offers
# to discard the fork's commits. This workflow does the same merge, but resolves
# the generated lockfile with pnpm and pushes the result, so the sync never
# stops on a generated file.
#
# A conflict in a real source file still stops the job on purpose: fix it by
# hand and re-run. Nothing is ever discarded.
#
# Required repository secret:
#   GITHUBTOKEN   PAT with contents:write. Falls back to GITHUB_TOKEN, but a push
#                 made with GITHUB_TOKEN does not start the CI/Docker workflows,
#                 so set the PAT if you want the image to be rebuilt after a sync.
#
# Runs on a schedule and on manual dispatch.
name: Sync Fork

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM_REPO: medusajs/dtc-starter
  UPSTREAM_BRANCH: main
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          # Always sync the default branch, even when dispatched from another.
          ref: ${{ github.event.repository.default_branch || 'master' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUBTOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Check if already up to date
        id: status
        run: |
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with ${UPSTREAM_REPO}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Merge upstream. Conflicts in generated files are resolved automatically
      # (upstream's copy wins, pnpm then re-adds the fork's own dependencies);
      # any other conflict is a real code conflict and is reported instead of
      # guessed at.
      - name: Merge upstream
        if: steps.status.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # Files that are generated, not authored, and must never stop a sync:
          #   pnpm-lock.yaml  -> upstream's copy, then pnpm re-adds the fork's deps
          #   *.tsbuildinfo   -> incremental-build cache; upstream's is fine as is
          take_upstream_copy() {
            case "$1" in
              pnpm-lock.yaml | *.tsbuildinfo) git checkout --theirs -- "$1" ;;
              *) return 1 ;;
            esac
            git add -- "$1"
          }

          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "Merged cleanly."
          else
            echo "Merge has conflicts; checking whether they are generated files only."
            unresolved=""
            lockfile_conflict=false
            for file in $(git diff --name-only --diff-filter=U); do
              if take_upstream_copy "$file"; then
                if [ "$file" = "pnpm-lock.yaml" ]; then lockfile_conflict=true; fi
              else
                unresolved="${unresolved}  ${file}"$'\n'
              fi
            done

            if [ -n "$unresolved" ]; then
              echo "::error::Real conflict in source files, resolve by hand:"
              printf '%s' "$unresolved"
              echo
              echo "Reproduce locally:"
              echo "  git fetch upstream ${UPSTREAM_BRANCH}"
              echo "  git merge upstream/${UPSTREAM_BRANCH}"
              echo "  # fix the files above, then commit and push ${DEFAULT_BRANCH}"
              git merge --abort
              exit 1
            fi

            if [ "$lockfile_conflict" = true ]; then
              # Re-add the fork's own dependencies to upstream's lockfile.
              pnpm install --lockfile-only --ignore-scripts
              git add pnpm-lock.yaml
            fi
            git commit --no-edit
          fi

          # Fail before pushing if the merged lockfile does not match the merged
          # package.json files (frozen mode only checks, it never rewrites).
          pnpm install --lockfile-only --frozen-lockfile

      - name: Push merged result
        if: steps.status.outputs.changed == 'true'
        run: git push origin "HEAD:${DEFAULT_BRANCH}"
